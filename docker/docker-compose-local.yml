# version: '3.8'

services:
  frontend-dev:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-dev
    restart: unless-stopped
    env_file:
      - ../frontend/.env
    ports:
      - "80:80"
    # Ограничения памяти в v1 пишутся напрямую в корень сервиса
    mem_limit: 64m

  backend-dev:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-dev
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - database-dev
    # Ограничения памяти в v1 пишутся напрямую в корень сервиса
    mem_limit: 512m

  database-dev:
    image: postgres:18-alpine
    container_name: database-dev
    restart: always
    command: postgres -c random_page_cost=1.1 -c shared_buffers=128MB -c max_connections=100 -c work_mem=4MB
    env_file:
      - ../database/.env
    ports:
      - "5432:5432"
    # Именованные тома (как pg_data) в v1 не поддерживаются. 
    # Используем локальную папку на компьютере (например, ./pg_data) для сохранения данных базы.
    volumes:
      - ../database/backup/full_backup.sql:/backup/full_backup.sql
      - ../database/pg_data:/var/lib/postgresql
    # Ограничения памяти для базы
    mem_limit: 512m
