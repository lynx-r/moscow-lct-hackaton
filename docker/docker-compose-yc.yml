version: '3.8'
services:
  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env
    ports:
      - "80:80"
    depends_on:
      - backend

  solver:
    build:
      context: ../solver
    environment:
      SOLVER_ENGINE: cpp
      SOLVER_WORKERS: 1
    mem_limit: 8g

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - solver
    # Ограничения памяти в v1 пишутся напрямую в корень сервиса
    mem_limit: 512m

