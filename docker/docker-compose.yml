version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "80:80"
    depends_on:
      - backend

  solver:
    build:
      context: ../solver
    environment:
      SOLVER_ENGINE: cpp
      SOLVER_WORKERS: 1
    mem_limit: 8g

  backend:
    build:
      context: ../backend
    environment:
      CORS_ALLOWED_METHODS: "*"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOW_CREDENTIALS: "false"
      SPRING_PROFILES_ACTIVE: prod

      # сколько ядер использовать
      CPU_LIMIT: 3

      ROUTING_BACKEND: solver
      SOLVER_URL: http://solver:8090
      SOLVER_HTTP_TIMEOUT_SECONDS: 900

    ports:
      - "8080:8080"
    depends_on:
      - solver
    mem_limit: 512m