services:
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    expose:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M # Максимум, который может взять контейнер
        reservations:
          memory: 256M # Гарантированный объем при старте

  database-dev:
    image: postgres:18-alpine
    container_name: database-dev
    restart: always
    command: >
      postgres
      -c random_page_cost=1.1
      -c shared_buffers=128MB
      -c max_connections=100
      -c work_mem=4MB
    env_file:
      - ../database/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ../database/backup/full_backup.sql:/backup/full_backup.sql
      - pg_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M # Максимум, который может взять контейнер
        reservations:
          memory: 256M # Гарантированный объем при старте

