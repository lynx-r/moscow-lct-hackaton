on:
  push:
    - workflows: [deploy-to-yc-vm]
      filter:
        branches: ["main"]

workflows:
  deploy-to-yc-vm:
    tasks:
      - name: build-and-deploy
        cubes:
          # Заменяем нативное подключение ручным логином через Docker-плагин
          - name: registry-login
            action: docker/login-action@v3
            with:
              registry: cr.yandex
              username: json_key
              password: ${{ secrets.YC_KEY_JSON }} # Используем секрет вместо connection

          # Настройка сборщика Docker Buildx
          - name: setup-buildx
            action: docker/setup-buildx-action@v3

          # Python/C++ solver, independently built for the deployment CPU/Python ABI.
          - name: build-and-push-solver
            action: docker/build-push-action@v6
            with:
              context: ./solver
              file: ./solver/Dockerfile
              push: true
              provenance: false
              cache-from: type=registry,ref=cr.yandex/crp357kesevoc357mb8a/solver:buildcache
              cache-to: type=registry,ref=cr.yandex/crp357kesevoc357mb8a/solver:buildcache,mode=max
              tags: cr.yandex/crp357kesevoc357mb8a/solver:latest

          # Сборка и пуш образа (заменяем ghcr.io на cr.yandex)
          - name: build-and-push-backend
            action: docker/build-push-action@v6
            with:
              context: ./backend
              file: ./backend/Dockerfile # Путь к вашему Dockerfile
              push: true
              # ОТКЛЮЧАЕМ ПРОВЕНАНС (АТТЕСТАЦИЮ), ЧТОБЫ ЯНДЕКС НЕ ПРИНИМАЛ ОБРАЗ ЗА ОШИБКУ
              provenance: false

              # Cache
              cache-from: type=registry,ref=cr.yandex/crp357kesevoc357mb8a/backend:buildcache
              cache-to: type=registry,ref=cr.yandex/crp357kesevoc357mb8a/backend:buildcache,mode=max

              # Обязательно замените ID_РЕЕСТРА на ваш ID из Yandex Cloud
              tags: cr.yandex/crp357kesevoc357mb8a/backend:latest

          - name: build-and-push-frontend
            action: docker/build-push-action@v6
            with:
              context: ./frontend
              file: ./frontend/Dockerfile # Путь к вашему Dockerfile
              push: true
              # ОТКЛЮЧАЕМ ПРОВЕНАНС (АТТЕСТАЦИЮ), ЧТОБЫ ЯНДЕКС НЕ ПРИНИМАЛ ОБРАЗ ЗА ОШИБКУ
              provenance: false

              # Cache
              cache-from: type=registry,ref=cr.yandex/crp357kesevoc357mb8a/frontend:buildcache
              cache-to: type=registry,ref=cr.yandex/crp357kesevoc357mb8a/frontend:buildcache,mode=max

              # Обязательно замените ID_РЕЕСТРА на ваш ID из Yandex Cloud
              tags: cr.yandex/crp357kesevoc357mb8a/frontend:latest

          # Деплой на вашу ВМ через SSH
          - name: deploy-via-ssh
            action: appleboy/ssh-action@master
            with:
              host: ${{ secrets.HOST }}
              username: ${{ secrets.USERNAME }}
              key: ${{ secrets.SSH_KEY }}
              script: |
                # Добавляем папку Яндекса в PATH текущей SSH-сессии
                export PATH=$PATH:/home/ubuntu/yandex-cloud/bin

                # Авторизуем Docker на ВМ для скачивания из вашего приватного реестра
                # (Для этого на ВМ должен быть установлен и настроен Yandex Cloud CLI)
                yc container registry configure-docker

                cd ~/dit

                git pull

                # Переходим в папку с docker-compose.yml
                cd docker
                docker compose pull
                docker compose up -d
                docker image prune -f
