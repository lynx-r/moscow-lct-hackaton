spring:
  profiles:
    active:
      - dev
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 65MB
  application:
    name: dit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dit_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
  # TODO: проставить timeout ответа сервера
  tomcat:
    connection-timeout: 1000

app:
  routing:
    backend: ${ROUTING_BACKEND:solver}
    solver-url: ${SOLVER_URL:http://localhost:8090}
    timeout-seconds: ${SOLVER_HTTP_TIMEOUT_SECONDS:900}

  solution:
    stage2:
      # Вычисляет общий минимальный охватывающий прямоугольник (Envelope)
      # для кластера ОКС с учетом технологического буфера
      clusterBufferMeters: 500.0
      # Пессимистичный радиус буфера для максимального ДУ 1400 мм по ТЗ (в метрах)
      bufferRadiusMeters: 2.0
      # Размер кластера
      clusterSizeMeters: 50.0
      # N метра буфера для точки подключения на границе здания
      # например, 2.0 или 3.0 метра
      oksConnectionPointBufferMeters: 2.0
      # Количество вариантов для генерации
      maxVariants: 3
      # Максимальная степень узла для камер по ТЗ
      maxValence: 4
      # из скольки кратчайших путей выбирать
      chooseFromPathsCount: 5
      # Ограничиваемся 3 параллельными кластерами
      parallelClusterCount: ${CPU_LIMIT:3}
      # Критерий уникальности: если более 70% вершин совпадают, считаем варианты идентичными
      pathUniquePercent: 0.7
      # 5 ближайших точек врезки при построении сети кластера
      closesSourcesCount: 5
      # Шаг дискретизации (нормативный отступ от препятствий в метрах)
      obstacleOffsetMeters: 3.0

  # утилиты для отладки работы алгоритма
  debug-utils:
    debugFolder: debug
    removeDebugFolderBeforeCreate: false
    disabled: true
    # URL по которому будут доступны статические файлы дебага
    staticDebugFilesUrl: ${STATIC_DEBUG_FILES_URL:http://localhost:8080/demo}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    filter: true
    tryItOutEnabled: true
    displayRequestDuration: true
    docExpansion: none
    showExtensions: true
    showCommonExtensions: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    persistAuthorization: true
  packages-to-scan:
    - com.ultra.dit.controller
  show-actuator: true

logging:
  level:
    "[com.ultra.dit]": DEBUG
    "[org.springframework.web.filter]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.postgresql]": DEBUG
    "[org.hibernate]": DEBUG
