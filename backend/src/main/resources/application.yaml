spring:
  profiles:
    active:
      - dev
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 65MB
  application:
    name: dit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dit_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

app:
  routing:
    backend: ${ROUTING_BACKEND:solver}
    solver-url: ${SOLVER_URL:http://localhost:8090}
    timeout-seconds: ${SOLVER_HTTP_TIMEOUT_SECONDS:900}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    filter: true
    tryItOutEnabled: true
    displayRequestDuration: true
    docExpansion: none
    showExtensions: true
    showCommonExtensions: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    persistAuthorization: true
  packages-to-scan:
    - com.ultra.dit.controller
  show-actuator: true

logging:
  level:
    "[com.ultra.dit]": DEBUG
    "[org.springframework.web.filter]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.postgresql]": DEBUG
    "[org.hibernate]": DEBUG
